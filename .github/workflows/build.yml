name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace
      - name: Private signing key (repository secret SB_SIGNING = "password:base64-keystore")
        env:
          SB_SIGNING: ${{ secrets.SB_SIGNING }}
        run: |
          if [ -n "$SB_SIGNING" ]; then
            printf '%s' "${SB_SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "::add-mask::${SB_SIGNING%%:*}"
            echo "SB_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SB_KEYSTORE_PASSWORD=${SB_SIGNING%%:*}" >> "$GITHUB_ENV"
            echo "Signing with the private release key"
          else
            echo "Signing with the standard StreamBox key"
          fi
      - name: Lint (errors fail the build)
        run: ./gradlew lintRelease --stacktrace
      - name: Build optimized release APK
        run: ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk StreamBoxTV.apk
      - name: Checksum for the in-app updater
        run: sha256sum StreamBoxTV.apk > StreamBoxTV.apk.sha256
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Release notes from the commit message
        run: |
          git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d' > notes.md
          echo "" >> notes.md
          echo "Download **StreamBoxTV.apk** below, or update from the app (Settings → Check for updates)." >> notes.md

      # Keep the artifact (needs sign-in to download)
      - uses: actions/upload-artifact@v4
        with:
          name: StreamBoxTV-apk
          path: StreamBoxTV.apk

      # Publish a Release so the APK has a permanent one-tap link:
      # https://github.com/mahmouddabash/streambox-tv/releases/latest/download/StreamBoxTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: StreamBox TV build ${{ github.run_number }}
          body_path: notes.md
          files: |
            StreamBoxTV.apk
            StreamBoxTV.apk.sha256
          make_latest: true
