name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk StreamBoxTV.apk

      # Keep the artifact (needs sign-in to download)
      - uses: actions/upload-artifact@v4
        with:
          name: StreamBoxTV-debug-apk
          path: StreamBoxTV.apk

      # Publish a Release so the APK has a permanent one-tap link:
      # https://github.com/mahmouddabash/streambox-tv/releases/latest/download/StreamBoxTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: StreamBox TV build ${{ github.run_number }}
          body: |
            Automatic build #${{ github.run_number }} from commit ${{ github.sha }}.

            Download **StreamBoxTV.apk** below and install it on your Android TV.
            Permanent newest-build link:
            https://github.com/mahmouddabash/streambox-tv/releases/latest/download/StreamBoxTV.apk
          files: StreamBoxTV.apk
          make_latest: true
